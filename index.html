eFloat(b.parentNode.querySelector('select').value);if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){alert('Speech is unavailable in this WebViewer. Open the website in Chrome or use a native TextToSpeech component.');return}stopAudio();let u=new SpeechSynthesisUtterance(text);u.lang={en:'en-IN',hi:'hi-IN',mr:'mr-IN'}[lang()];u.rate=rate;speechSynthesis.speak(u)}function go(page,id){stack[stack.length-1].scroll=window.scrollY;stack.push({page,id,scroll:0});render();window.scrollTo(0,0)}function back(){if(stack.length>1){stack.pop();render();window.scrollTo(0,stack.at(-1).scroll)}}function home(){stack=[{page:'home',scroll:0}];render();window.scrollTo(0,0)}function panel(title,body){return `<h2>${esc(title)}</h2>${audio(title)}${body}`}function schemeCard(s){return `<article class="card"><h3>${esc(s.name)}</h3><p class="muted">${esc(s.level)} · ${esc(s.cat)} · ${s.demo?'Fictional demo':'Official reference; status not checked'} · ${esc(s.status||'Verification pending')}</p><p>${esc(desc(s))}</p>${audio(desc(s))}<button onclick="go('detail',${s.id})">${tr('View details','विवरण देखें','तपशील पहा')}</button></article>`}function fields(p){return `<label>Name / नाम / नाव<input id="name" required maxlength="50" value="${esc(p.name)}"></label><label>Age / उम्र / वय<input id="age" type="number" min="0" max="120" required value="${p.age}"></label><label>Annual income (demo INR)<input id="income" type="number" min="0" required value="${p.income}"></label><label>Occupation<select id="job">${['Student','Farmer','Worker','Retired','Other'].map(x=>`<option ${p.job===x?'selected':''}>${x}</option>`).join('')}</select></label><label>State<select id="state">${['Maharashtra','Gujarat','Karnataka','Other'].map(x=>`<option ${p.state===x?'selected':''}>${x}</option>`).join('')}</select></label>`}function capture(){return {name:$('name').value,age:+$('age').value,income:+$('income').value,job:$('job').value,state:$('state').value}}function storeProfile(e){e.preventDefault();pro ect onchange="prefs.lang=this.value;save('ysPrefs',prefs);render()"><option value="en" ${lang()==='en'?'selected':''}>English</option><option value="hi" ${lang()==='hi'?'selected':''}>हिंदी</option><option value="mr" ${lang()==='mr'?'selected':''}>मराठी</option></select></label><label>Default audio speed<select onchange="prefs.speed=this.value;save('ysPrefs',prefs)">${['0.5','0.75','1','1.25','1.5','1.75','2'].map(x=>`<option ${prefs.speed===x?'selected':''}>${x}</option>`).join('')}</select></label><label><input style="display:inline;width:auto" type="checkbox" ${prefs.dark?'checked':''} onchange="prefs.dark=this.checked;save('ysPrefs',prefs);render()"> Dark theme</label><button onclick="go('privacy')">Privacy & help</button><p>Partial translation in this prototype. Account login/password require a real backend.</p>`)}else if(page==='profile'){out=panel('Edit demo profile',`<form onsubmit="storeProfile(event)">${fields(profile)}<button class="primary">Save</button></form>`)}else if(page==='privacy'){out=panel('Privacy & help',`<p>This is an unofficial competition prototype. Use fictional data only. Data is stored on this device, not securely authenticated. Real scheme status and eligibility must be checked on official portals.</p><button onclick="if(confirm('Delete all local demo data?')){['ysPrefs','ysProfile','ysFamily','ysFollow','ysTasks','ysStatus','ysHistory'].forEach(k=>localStorage.removeItem(k));location.reload()}">Clear demo data</button>`)}$('app').innerHTML=nav+out;if(page==='explore')searchResults()}

function configureDb(e){e.preventDefault();let u=$('dburl').value.trim().replace(/\/+$/,'');if(!/^https:\/\/[a-z0-9-]+(?:\.[a-z0-9-]+)?\.(?:firebaseio\.com|firebasedatabase\.app)$/.test(u)){alert('Enter the exact HTTPS Realtime Database URL, without a path.');return;}dbUrl=u;save('ysDbUrl',u);syncNow();}
